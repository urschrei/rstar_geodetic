[package]
name = "rstar_geodetic_wasm"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "WebAssembly bindings for the rstar_geodetic geodetic R-tree"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# `cdylib` is the wasm module; `rlib` lets `cargo clippy --workspace` and host-side
# unit tests compile the crate as an ordinary library.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The WGS84 geodesic queries are compiled into the wasm module by default, as for the
# Python wheels. `std` is needed for the coordinate-keyed position map.
rstar_geodetic = { path = "..", features = ["std", "wgs84"] }
# For the `PointDistance` trait method the within-distance query calls on each hit. Must
# match the version `rstar_geodetic` uses.
rstar = "0.13"
wasm-bindgen = "0.2"
# Typed-array and plain-object construction for query results.
js-sys = "0.3"
# Routes a Rust panic message to `console.error` instead of an opaque `unreachable` trap.
console_error_panic_hook = "0.1"
